# P51: สร้าง Demo (Simulation + Mock PLC ในเบราว์เซอร์, SPEC § 4.33) แล้วเผยแพร่บน GitHub Pages ทุกครั้งที่ push main
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # W7 (SPEC § 4.44): Repository variable ACCOUNTS_API_URL = URL ของ Server บน Render — ไม่ตั้ง = Demo ไม่ต้อง Login
      - run: npm run build:demo
        env:
          VITE_ACCOUNTS_API: ${{ vars.ACCOUNTS_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
